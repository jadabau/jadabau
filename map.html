<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #06080f;
      color: #e2ddd5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 28px;
      gap: 0;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e8a020;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    h1 {
      font-size: clamp(18px, 3vw, 32px);
      font-weight: 300;
      letter-spacing: 0.03em;
      color: #ede9e0;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 11px;
      color: #283347;
      letter-spacing: 0.09em;
    }

    /* ── Map wrap ─────────────────────────────────────────── */
    .map-wrap {
      width: 100%;
      max-width: 1120px;
      position: relative;
    }

    #map {
      width: 100%;
      display: block;
    }

    /* ── SVG map elements ─────────────────────────────────── */
    .sphere    { fill: #07101e; }
    .graticule { fill: none; stroke: #0b1524; stroke-width: 0.35; }
    .country   { fill: #0d1828; stroke: #162235; stroke-width: 0.35; }
    .borders   { fill: none; stroke: #0d1828; stroke-width: 0.4; }

    /* ── Primary dots ─────────────────────────────────────── */
    .dot-primary { cursor: pointer; }

    .dot-primary .halo {
      fill: none;
      stroke: rgba(232, 160, 32, 0);
      stroke-width: 10;
      transition: stroke 0.3s ease;
    }

    .dot-primary:hover .halo,
    .dot-primary.active .halo {
      stroke: rgba(232, 160, 32, 0.1);
    }

    .dot-primary .pulse {
      fill: none;
      stroke: rgba(232, 160, 32, 0.5);
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseRing 3s ease-out infinite;
    }

    .dot-primary .core {
      fill: #e8a020;
      transition: fill 0.2s ease;
    }

    .dot-primary:hover .core,
    .dot-primary.active .core {
      fill: #ffc84a;
    }

    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 0.65; }
      100% { transform: scale(4.5); opacity: 0;    }
    }

    /* ── Impact elements ──────────────────────────────────── */
    .dot-impact {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .dot-impact.show { opacity: 1; }

    .dot-impact .core {
      fill: #4dd9c8;
      filter: url(#impactGlow);
    }

    .impact-ring {
      fill: none;
      stroke: rgba(77, 217, 200, 0.55);
      stroke-width: 1.5;
      pointer-events: none;
      filter: url(#impactGlow);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .impact-ring.show { opacity: 1; }

    /* ── Arcs ─────────────────────────────────────────────── */
    .arc {
      fill: none;
      stroke: rgba(232, 160, 32, 0.28);
      stroke-width: 0.75;
      stroke-dasharray: 3 6;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .arc.show { opacity: 1; }

    /* ── Tooltip ──────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.14s ease, transform 0.14s ease;
      transform: translateY(6px);
    }
    #tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tt-card {
      background: rgba(6, 9, 18, 0.96);
      border: 1px solid rgba(232, 160, 32, 0.18);
      border-radius: 12px;
      padding: 15px 18px;
      width: 245px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
    }

    .tt-location {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #e8a020;
      margin-bottom: 11px;
      opacity: 0.9;
    }

    .tt-role {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tt-role + .tt-role {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(255, 255, 255, 0.055);
    }

    .tt-title {
      font-size: 12.5px;
      font-weight: 500;
      color: #ede9e0;
      line-height: 1.35;
    }

    .tt-org {
      font-size: 11px;
      font-weight: 400;
      color: #3a4d68;
      line-height: 1.3;
    }

    .tt-reach {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.055);
      font-size: 10px;
      color: #4dd9c8;
      letter-spacing: 0.03em;
      opacity: 0.85;
    }

    .tt-reach-icon {
      display: inline-block;
      margin-right: 4px;
      opacity: 0.7;
    }

    /* ── Legend ───────────────────────────────────────────── */
    .legend {
      display: flex;
      gap: 22px;
      justify-content: center;
      margin-top: 14px;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9.5px;
      color: #283347;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .leg-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .leg-dot.p { background: #e8a020; box-shadow: 0 0 6px rgba(232,160,32,0.85); }
    .leg-dot.i { background: #4dd9c8; box-shadow: 0 0 6px rgba(77,217,200,0.85); }

    /* ── Appear animation ─────────────────────────────────── */
    .dot-primary {
      opacity: 0;
      animation: dotAppear 0.6s ease forwards;
    }

    @keyframes dotAppear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">Portfolio</div>
    <h1>Where Design Happened</h1>
    <p class="subtitle">Hover a location to explore work &amp; impact</p>
  </header>

  <div class="map-wrap">
    <svg id="map"></svg>
  </div>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot p"></div>Work experience</div>
    <div class="leg-item"><div class="leg-dot i"></div>Impact &amp; reach</div>
  </div>
</div>

<div id="tooltip"><div class="tt-card" id="tt-inner"></div></div>

<script>
// ─── Data ─────────────────────────────────────────────────────────────────────

const PRIMARY = [
  {
    id: "south-bend",
    name: "South Bend, IN",
    coords: [-86.252, 41.676],
    roles: [
      { title: "Product Design",    org: "Notre Dame" },
      { title: "Head of Design",    org: "Future of Labor Lab" },
      { title: "Design Intern",     org: "Global Center for the Development of the Whole Child" },
      { title: "Brand Storyteller", org: "Institute for Ethics & the Common Good" },
      { title: "Design Columnist",  org: "The New AI Project" }
    ],
    impacts: ["washington-dc", "india", "haiti"]
  },
  {
    id: "kylemore",
    name: "Kylemore, Ireland",
    coords: [-9.893, 53.557],
    roles: [{ title: "Design Intern", org: "Threshold Festival Ireland" }],
    impacts: []
  },
  {
    id: "minneapolis",
    name: "Minneapolis / St. Paul",
    coords: [-93.265, 44.978],
    roles: [{ title: "Product Designer", org: "Find Love Safely" }],
    impacts: ["san-francisco", "sacramento", "los-angeles", "san-diego",
               "phoenix", "chicago", "nashville", "boston", "denver"]
  },
  {
    id: "cambridge",
    name: "Cambridge, UK",
    coords: [0.122, 52.205],
    roles: [
      { title: "Head of Design",           org: "Monastayers" },
      { title: "Design & Research Intern", org: "Von Hugel Institute" }
    ],
    impacts: ["worth-abbey", "minster-abbey"]
  },
  {
    id: "boston",
    name: "Boston, MA",
    coords: [-71.059, 42.360],
    roles: [{ title: "Course Co-Design Intern", org: "Northeastern University" }],
    impacts: []
  },
  {
    id: "philippines",
    name: "Philippines",
    coords: [121.774, 12.880],
    roles: [{ title: "Co-Founder", org: "No Place Like Manila" }],
    impacts: []
  },
  {
    id: "london",
    name: "London, UK",
    coords: [-0.128, 51.507],
    roles: [{ title: "Research Abroad", org: "London" }],
    impacts: []
  },
  {
    id: "rome",
    name: "Rome, Italy",
    coords: [12.496, 41.903],
    roles: [{ title: "Research Abroad", org: "Rome" }],
    impacts: []
  },
  {
    id: "germany",
    name: "Germany",
    coords: [10.452, 51.166],
    roles: [{ title: "Research Abroad", org: "Germany" }],
    impacts: []
  }
];

// Impact-only locations (shown only when their parent is hovered)
const IMPACT_ONLY = [
  { id: "washington-dc",  name: "Washington DC",   coords: [-77.037,  38.907] },
  { id: "india",          name: "India",            coords: [ 78.963,  20.594] },
  { id: "haiti",          name: "Haiti",            coords: [-72.285,  18.971] },
  { id: "san-francisco",  name: "San Francisco",    coords: [-122.419, 37.775] },
  { id: "sacramento",     name: "Sacramento",       coords: [-121.494, 38.582] },
  { id: "los-angeles",    name: "Los Angeles",      coords: [-118.244, 34.052] },
  { id: "san-diego",      name: "San Diego",        coords: [-117.161, 32.716] },
  { id: "phoenix",        name: "Phoenix",          coords: [-112.074, 33.448] },
  { id: "chicago",        name: "Chicago",          coords: [ -87.630, 41.878] },
  { id: "nashville",      name: "Nashville",        coords: [ -86.782, 36.163] },
  { id: "denver",         name: "Denver",           coords: [-104.990, 39.739] },
  { id: "worth-abbey",    name: "Worth Abbey",      coords: [  -0.147, 51.107] },
  { id: "minster-abbey",  name: "Minster Abbey",    coords: [   0.827, 51.339] }
];

// Lookup for all locations
const LOC = {};
[...PRIMARY, ...IMPACT_ONLY].forEach(d => { LOC[d.id] = d; });
const primaryIds = new Set(PRIMARY.map(p => p.id));

// ─── Map setup ────────────────────────────────────────────────────────────────

const W = 1120, H = 580;
const svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);

const projection = d3.geoNaturalEarth1()
  .scale(174)
  .translate([W / 2, H / 2 + 18]);

const pathGen = d3.geoPath().projection(projection);

// ─── Defs ─────────────────────────────────────────────────────────────────────

const defs = svg.append("defs");

// Glow filter for primary dots
(function() {
  const f = defs.append("filter").attr("id", "dotGlow")
    .attr("x", "-120%").attr("y", "-120%")
    .attr("width", "340%").attr("height", "340%");
  f.append("feGaussianBlur").attr("in", "SourceGraphic").attr("stdDeviation", "3.5").attr("result", "b");
  const m = f.append("feMerge");
  m.append("feMergeNode").attr("in", "b");
  m.append("feMergeNode").attr("in", "SourceGraphic");
})();

// Glow filter for impact dots
(function() {
  const f = defs.append("filter").attr("id", "impactGlow")
    .attr("x", "-120%").attr("y", "-120%")
    .attr("width", "340%").attr("height", "340%");
  f.append("feGaussianBlur").attr("in", "SourceGraphic").attr("stdDeviation", "2.5").attr("result", "b");
  const m = f.append("feMerge");
  m.append("feMergeNode").attr("in", "b");
  m.append("feMergeNode").attr("in", "SourceGraphic");
})();

// Radial vignette
(function() {
  const g = defs.append("radialGradient").attr("id", "vig")
    .attr("cx", "50%").attr("cy", "50%").attr("r", "65%");
  g.append("stop").attr("offset", "0%").attr("stop-color", "transparent").attr("stop-opacity", 0);
  g.append("stop").attr("offset", "100%").attr("stop-color", "#06080f").attr("stop-opacity", 0.65);
})();

// ─── Layer order ──────────────────────────────────────────────────────────────

const gBg       = svg.append("g");          // sphere + graticule
const gLand     = svg.append("g");          // countries
const gArcs     = svg.append("g");          // connection arcs
const gImpacts  = svg.append("g");          // impact-only dots
const gRings    = svg.append("g");          // impact rings on primary dots
const gDots     = svg.append("g");          // primary dots
const gOverlay  = svg.append("g");          // vignette on top

// ─── Load world atlas ─────────────────────────────────────────────────────────

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {

  // Sphere
  gBg.append("path")
    .datum({ type: "Sphere" })
    .attr("class", "sphere")
    .attr("d", pathGen);

  // Graticule
  gBg.append("path")
    .datum(d3.geoGraticule()())
    .attr("class", "graticule")
    .attr("d", pathGen);

  // Countries
  gLand.selectAll("path.country")
    .data(topojson.feature(world, world.objects.countries).features)
    .join("path")
    .attr("class", "country")
    .attr("d", pathGen);

  // Country borders mesh
  gLand.append("path")
    .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
    .attr("class", "borders")
    .attr("d", pathGen);

  // Vignette overlay
  gOverlay.append("rect")
    .attr("width", W).attr("height", H)
    .attr("fill", "url(#vig)")
    .attr("pointer-events", "none");

  // ── Pre-render arcs (hidden) ───────────────────────────────────────────────

  PRIMARY.forEach(loc => {
    if (!loc.impacts.length) return;
    loc.impacts.forEach(impId => {
      const imp = LOC[impId];
      if (!imp) return;
      gArcs.append("path")
        .attr("class", "arc")
        .attr("data-from", loc.id)
        .attr("data-to", impId)
        .attr("d", pathGen({ type: "LineString", coordinates: [loc.coords, imp.coords] }));
    });
  });

  // ── Impact-only dots (hidden) ──────────────────────────────────────────────

  IMPACT_ONLY.forEach(imp => {
    const p = projection(imp.coords);
    if (!p) return;
    const [x, y] = p;

    const g = gImpacts.append("g")
      .attr("class", "dot-impact")
      .attr("data-id", imp.id)
      .attr("transform", `translate(${x},${y})`);

    g.append("circle").attr("class", "core").attr("r", 2.8).attr("cx", 0).attr("cy", 0);
  });

  // ── Impact rings for primary dots that are also impact targets ─────────────
  // (Boston appears in Minneapolis's impact list but is also a primary dot)
  // These rings are added to gRings layer and toggled by JS

  // ── Primary dots ──────────────────────────────────────────────────────────

  PRIMARY.forEach((loc, i) => {
    const p = projection(loc.coords);
    if (!p) return;
    const [x, y] = p;

    const r = Math.min(3.5 + loc.roles.length * 0.45, 6.5);

    const g = gDots.append("g")
      .attr("class", "dot-primary")
      .attr("data-id", loc.id)
      .attr("transform", `translate(${x},${y})`)
      .style("animation-delay", `${i * 80}ms`);

    // Large invisible hit area
    g.append("circle").attr("r", 18).attr("cx", 0).attr("cy", 0)
      .attr("fill", "transparent").attr("stroke", "none");

    // Hover halo
    g.append("circle").attr("class", "halo").attr("r", r + 9).attr("cx", 0).attr("cy", 0);

    // Pulse ring (staggered)
    g.append("circle")
      .attr("class", "pulse")
      .attr("r", r).attr("cx", 0).attr("cy", 0)
      .style("animation-delay", `${(Math.random() * 2.5).toFixed(2)}s`);

    // Core dot
    g.append("circle")
      .attr("class", "core")
      .attr("r", r).attr("cx", 0).attr("cy", 0)
      .attr("filter", "url(#dotGlow)");

    // Interactions
    g.on("mouseenter", (ev) => { activate(loc.id); showTip(ev, loc); })
     .on("mousemove",  (ev) => { moveTip(ev); })
     .on("mouseleave", ()  => { deactivate(); hideTip(); })
     .on("click",      (ev) => {
       ev.stopPropagation();
       if (activeId === loc.id) { deactivate(); hideTip(); }
       else { activate(loc.id); showTip(ev, loc); }
     });
  });

  // Click on map background to deactivate
  svg.on("click", () => { deactivate(); hideTip(); });

});

// ─── Interaction ──────────────────────────────────────────────────────────────

let activeId = null;

function activate(id) {
  if (activeId === id) return;
  deactivate();
  activeId = id;

  // Active state on dot
  d3.selectAll(".dot-primary")
    .filter(function() { return d3.select(this).attr("data-id") === id; })
    .classed("active", true);

  // Show arcs
  d3.selectAll(".arc")
    .filter(function() { return d3.select(this).attr("data-from") === id; })
    .classed("show", true);

  const loc = PRIMARY.find(p => p.id === id);
  if (!loc) return;

  loc.impacts.forEach(impId => {
    if (primaryIds.has(impId)) {
      // Target is a primary dot — add an impact ring in the rings layer
      const target = d3.selectAll(".dot-primary")
        .filter(function() { return d3.select(this).attr("data-id") === impId; });
      const rx = parseFloat(target.attr("transform")?.match(/translate\(([^,]+)/)?.[1] || 0);
      const ry = parseFloat(target.attr("transform")?.match(/,([^)]+)/)?.[1] || 0);
      const coreR = parseFloat(target.select("circle.core").attr("r")) || 4;

      gRings.append("circle")
        .attr("class", "impact-ring show")
        .attr("data-parent", id)
        .attr("cx", rx).attr("cy", ry)
        .attr("r", coreR + 5);
    } else {
      d3.selectAll(".dot-impact")
        .filter(function() { return d3.select(this).attr("data-id") === impId; })
        .classed("show", true);
    }
  });
}

function deactivate() {
  activeId = null;
  d3.selectAll(".dot-primary").classed("active", false);
  d3.selectAll(".arc").classed("show", false);
  d3.selectAll(".dot-impact").classed("show", false);
  d3.selectAll(".impact-ring").remove();
}

// ─── Tooltip ──────────────────────────────────────────────────────────────────

const tooltip = document.getElementById("tooltip");
const ttInner  = document.getElementById("tt-inner");

function showTip(ev, loc) {
  let html = `<div class="tt-location">${loc.name}</div>`;

  loc.roles.forEach(r => {
    html += `<div class="tt-role">
      <div class="tt-title">${r.title}</div>
      ${r.org ? `<div class="tt-org">${r.org}</div>` : ""}
    </div>`;
  });

  if (loc.impacts.length) {
    const names = loc.impacts.map(id => LOC[id]?.name).filter(Boolean);
    const count = names.length;
    html += `<div class="tt-reach">
      <span class="tt-reach-icon">↗</span>
      Reached ${count} location${count !== 1 ? "s" : ""}
    </div>`;
  }

  ttInner.innerHTML = html;
  tooltip.classList.add("show");
  moveTip(ev);
}

function moveTip(ev) {
  const pad = 18, tw = 263;
  let lx = ev.clientX + pad;
  let ly = ev.clientY - 16;
  if (lx + tw > window.innerWidth - 8)  lx = ev.clientX - tw - pad;
  if (ly < 8)                            ly = ev.clientY + pad;
  if (ly + 400 > window.innerHeight)     ly = window.innerHeight - 420;
  tooltip.style.left = `${lx}px`;
  tooltip.style.top  = `${ly}px`;
}

function hideTip() {
  tooltip.classList.remove("show");
}
</script>
</body>
</html>
